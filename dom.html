<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Cours sur le DOM</title>
  </head>
  <body>
    <main class="main" id="main">
      <h1>Cours sur le DOM</h1>
      <div>
        <form>
          <div class="input">
            <input type="number" name="number1" id="number1" />
            <input type="number" name="number2" id="number2" />
          </div>
          <div class="btns">
            <button type="button" onclick="sum()" class="btn btn-calcul">
              Calculer
            </button>
            <button
              hidden
              type="button"
              onclick="reset()"
              class="btn btn-reset"
            >
              Annuler
            </button>
          </div>
        </form>
      </div>
      <div class="result">
        <p>Resultat : <span id="result"></span></p>
      </div>
    </main>
    <script src="./scripts/dom.js" type="text/javascript"></script>
  </body>
</html>
